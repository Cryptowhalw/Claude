name: Build Windows

# Builds MobileServicePro.exe and the installer on a real Windows machine
# and attaches them to the run (Actions -> run -> Artifacts).
on:
  push:
    paths:
      - 'MobileServicePro/**'
      - 'installer/**'
      - 'build.ps1'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build exe and installer (build.ps1, Windows PowerShell 5.1)
        shell: powershell
        run: .\build.ps1

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: MobileServicePro-Setup
          path: artifacts/installer/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: MobileServicePro-portable
          path: artifacts/publish/
          if-no-files-found: error
          retention-days: 14
